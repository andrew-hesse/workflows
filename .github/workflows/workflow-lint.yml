name: Workflow lint

# Reusable: audits this repo's own GitHub Actions workflows with zizmor.
#
# Call it from a repo with:
#
#   jobs:
#     workflow-lint:
#       uses: andrew-hesse/workflows/.github/workflows/workflow-lint.yml@9ea273620d28a73a11aac80941d33c86f4adbf7a # v3.8
#
# Reusable workflows must live directly in .github/workflows/ of this repo;
# GitHub does not support subdirectories there.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner labels as a JSON list, e.g. '["box"]' for the
          self-hosted runner on box (ahesse/docs github/self-hosted-runner.md).
          JSON because a reusable workflow's inputs are only strings, numbers
          and booleans, and runs-on needs a list to match several labels.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      persona:
        description: "zizmor auditing persona: regular, pedantic, or auditor."
        required: false
        type: string
        default: regular
      min-severity:
        description: "Lowest severity that is reported: informational, low, medium, high."
        required: false
        type: string
        default: low

# Nothing here writes anything; the job grants its own read scope.
permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this, the job token stays in .git/config where any later
          # step can read it. Nothing here pushes, so drop it.
          persist-credentials: false

      # Package-store caches (setup-node's `cache:`, pnpm/action-setup's
      # `cache: true`, actions/cache over the pnpm store) cost more than they
      # save on these repos: most restores miss, each miss uploads the whole
      # store, and on box even a hit loses to a cold install. Measured in
      # ahesse/docs github/self-hosted-runner.md. Line-based rather than a YAML
      # parser, because box's job image has no PyYAML; it reads the steps
      # of every workflow and local composite action, and checks itself on a
      # known-bad sample first so it cannot pass by matching nothing.
      - name: No package-store cache
        shell: python3 {0}
        run: |
          import pathlib
          import re
          import sys

          KEY = re.compile(r"^\s*(?:-\s+)?([A-Za-z0-9_-]+):\s*(.*?)\s*(?:\s#.*)?$")
          OFF = {"", "''", '""', "false", "'false'", '"false"'}


          def steps(text):
              """Split a workflow into list items: (first line, {key: [(line, value)]}, body)."""
              out, cur = [], None
              for n, raw in enumerate(text.splitlines(), 1):
                  body = raw.lstrip()
                  if not body or body.startswith("#"):
                      continue
                  indent = len(raw) - len(body)
                  if cur is not None and indent <= cur["indent"] and not body.startswith("- "):
                      cur = None
                  if body.startswith("- ") and (cur is None or indent <= cur["indent"]):
                      cur = {"indent": indent, "line": n, "keys": {}, "body": []}
                      out.append(cur)
                  if cur is None:
                      continue
                  cur["body"].append((indent, raw))
                  m = KEY.match(raw)
                  if m:
                      cur["keys"].setdefault(m.group(1), []).append((n, m.group(2)))
              return out


          def cache_path(step):
              """The path input of a cache step, block scalar included, lowercased."""
              lines, within = [], None
              for indent, raw in step["body"]:
                  if within is not None:
                      if indent <= within:
                          break
                      lines.append(raw)
                      continue
                  m = KEY.match(raw)
                  if m and m.group(1) == "path":
                      lines.append(m.group(2))
                      within = indent
              return "\n".join(lines).lower()


          def findings(text):
              """(line, message) for each step that caches a package store."""
              found = []
              for s in steps(text):
                  uses = s["keys"].get("uses", [(0, "")])[0][1].strip("'\"").split("@")[0]
                  cache = s["keys"].get("cache", [])
                  if uses == "actions/setup-node":
                      found += [(n, "setup-node caches the package store (cache: %s)" % v)
                                for n, v in cache if v not in OFF]
                  elif uses == "pnpm/action-setup":
                      found += [(n, "pnpm/action-setup caches the pnpm store (cache: %s)" % v)
                                for n, v in cache if v not in OFF]
                  elif re.fullmatch(r"actions/cache(/restore|/save)?", uses) and "pnpm" in cache_path(s):
                      found.append((s["line"], "%s caches the pnpm store" % uses))
              return found


          # A check that finds nothing must prove it can find something: run it on a
          # known-bad sample first. Built line by line so this file does not itself
          # contain the shapes it looks for.
          bad = "\n".join([
              "    steps:",
              "      - uses: actions/setup-node@x",
              "        with:",
              "          node-version: 24",
              "          cache" + ": pnpm",
              "      - name: pnpm",
              "        uses: pnpm/action-setup@x",
              "        with:",
              "          cache" + ": true",
              "      - uses: actions/cache/restore@x",
              "        with:",
              "          path: ~/.local/share/" + "pnpm/store",
              "          key: k",
              "      - uses: actions/setup-node@x",
              "        with:",
              "          package-manager-cache: false",
              "      - uses: pnpm/action-setup@x",
              "        with:",
              "          cache" + ": false",
              "      - uses: actions/cache@x",
              "        with:",
              "          path: node_modules/.astro",
              "          key: astro-${{ hashFiles('" + "pnpm-lock.yaml') }}",
              "      - uses: actions/cache@x",
              "        with:",
              "          path: |",
              "            ~/.cache/x",
              "            ~/.local/share/" + "pnpm/store",
              "          key: k",
          ])
          got = [n for n, _ in findings(bad)]
          if got != [5, 9, 10, 24]:
              print("::error::the package-store cache check missed its own sample (got lines %s, want [5, 9, 10, 24])" % got)
              sys.exit(1)

          files = sorted(p for pat in (".github/workflows/*.yml", ".github/workflows/*.yaml",
                                       ".github/actions/**/action.yml", ".github/actions/**/action.yaml")
                         for p in pathlib.Path(".").glob(pat))
          failed = False
          for p in files:
              try:
                  text = p.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError) as e:
                  print("::error file=%s::could not read: %s" % (p, e))
                  failed = True
                  continue
              for n, msg in findings(text):
                  print("::error file=%s,line=%d::%s. Package-store caches cost more than they "
                        "save here; see ahesse/docs github/self-hosted-runner.md." % (p, n, msg))
                  failed = True
          print("workflow files examined: %d" % len(files))
          if not files:
              print("::error::no workflow files found under .github/; was the repository checked out?")
              failed = True
          sys.exit(1 if failed else 0)

      # advanced-security: false is required. The action defaults to uploading
      # SARIF to the security tab, which needs GitHub Advanced Security and so
      # fails on a private repo. Annotations need only `contents: read`, and are
      # mutually exclusive with the SARIF path.
      # The zizmor version is fixed by this pin. The action's `version` input defaults to
      # `latest`, but that resolves to a lock file inside the action's own tree
      # (support/locks/zizmor-latest.txt, hash-pinned wheels), not to whatever is newest at
      # run time: v0.8.1 runs zizmor 1.32.0. A zizmor upgrade is therefore a bump of this pin,
      # reviewed like any other, and its new audits show up in that PR's own CI.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          # Set explicitly rather than inherited. The action defaults this to
          # true, and the online audits are what catch ref-version-mismatch, so
          # the gate's strength would otherwise depend on an upstream default
          # that could change without us noticing.
          online-audits: true
          persona: ${{ inputs.persona }}
          min-severity: ${{ inputs.min-severity }}
