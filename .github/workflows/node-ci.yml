name: Node CI

# Reusable: the standard pnpm PR gate. Runs the same four scripts the pre-push
# hook runs, so a clean push means a green PR.
#
#   jobs:
#     ci:
#       uses: andrew-hesse/workflows/.github/workflows/node-ci.yml@1af5db3082910f24c257ca8994df316f8bd3ed40 # v3.9
#
# This only works because the script vocabulary is standardised (see CI.md in
# ahesse/docs): every repo exposes lint, typecheck, test and build meaning the
# same thing. Without that this would need an input per script name, and the
# caller would be as long as the workflow it replaced.
#
# A repo needing extra setup (a system binary, a private registry credential)
# keeps its own ci.yml rather than passing a shell command in as an input:
# injecting `run:` content through an input is the template-injection shape the
# workflow linter flags.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner labels as a JSON list, e.g. '["box"]' for the
          self-hosted runner on box (ahesse/docs github/self-hosted-runner.md).
          JSON because a reusable workflow's inputs are only strings, numbers
          and booleans, and runs-on needs a list to match several labels.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      node-version:
        description: "Node major to test against. Match the repo's engines.node. Ignored if node-version-file is set."
        required: false
        type: string
        default: '24'
      node-version-file:
        description: >-
          Path to a file holding the Node version (.node-version, .nvmrc).
          Takes precedence over node-version, so a repo that pins the version in
          a file keeps one source of truth instead of restating it here.
        required: false
        type: string
        default: ''
      test-script:
        description: >-
          package.json script that runs the suite. Point it at a stricter script
          where the repo has one, typically a coverage run with enforced floors:
          a repo whose own gate was stricter than `pnpm test` would otherwise
          have to re-run the suite in a second job to keep that floor, and a
          gate may get stronger, never weaker.
        required: false
        type: string
        default: test
      run-build:
        description: "Run `pnpm build`. Off for repos with no build step."
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout. A hung job otherwise runs to GitHub's 6 hour default."
        required: false
        type: number
        default: 10
      require-worker-observability:
        description: >-
          Fail unless every Wrangler config at the repository root keeps Workers
          Logs on in every environment. A repo with no Wrangler config passes.
          Turn it off only for a Worker the owner has exempted, and say why in
          the caller.
        required: false
        type: boolean
        default: true
      npm-token-op-ref:
        description: >-
          op:// reference to a read:packages token, for repos installing private
          @andrew-hesse packages from npm.pkg.github.com, which serves no
          anonymous reads. Leave empty when every dependency is public.
          Requires the OP_SERVICE_ACCOUNT_TOKEN secret.
        required: false
        type: string
        default: ''
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "Only needed when npm-token-op-ref is set."
        required: false

permissions: {}

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the job token out of .git/config where
          # any later step could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Two steps rather than one, because setup-node lets node-version win when
      # both are supplied: passing them together would silently ignore the file.
      #
      # No package-store cache, on purpose: it costs more than it saves.
      # setup-node keys the entry on the lockfile hash with no fallback key, and
      # a pull request's entry is visible only to that pull request, so most
      # restores miss, and every miss uploads the whole store (about 200 MB) in
      # a post step. On box that upload crosses the home uplink (10 to 65 s),
      # and even a hit there is slower than a cold install, which fetches only
      # the compressed packages. package-manager-cache: false keeps setup-node
      # from turning a cache on by itself. The numbers are in ahesse/docs
      # github/self-hosted-runner.md; workflow-lint fails a workflow that
      # turns the cache back on.
      - name: Setup Node.js
        if: inputs.node-version-file == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Setup Node.js (from file)
        if: inputs.node-version-file != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      # op is not preinstalled on GitHub-hosted runners, and the install is per
      # job, so it has to happen here rather than in the caller.
      - name: Setup 1Password CLI
        if: inputs.npm-token-op-ref != ''
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          # Pinned: the action defaults to "latest", an unpinned tool in a SHA-pinned
          # pipeline. Bump here and in the sibling workflow together.
          version: 2.40.0

      # The token goes in a user-level npmrc: pnpm refuses to expand credentials
      # read from a committed project .npmrc and fails later with a misleading
      # 401. The op:// ref travels via env, never interpolated into the shell.
      # The token is read on a line of its own and checked: inside printf's
      # arguments a failed or empty `op read` is ignored, an empty token is
      # written, and the install fails later with a misleading 401. This step
      # holds the service account token and runs nothing but op.
      - name: Authenticate to GitHub Packages
        if: inputs.npm-token-op-ref != ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN_OP_REF: ${{ inputs.npm-token-op-ref }}
        run: |
          umask 077
          token="$(op read "$NPM_TOKEN_OP_REF")"
          [ -n "$token" ] || { echo "::error::the GitHub Packages token read from 1Password is empty"; exit 1; }
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$token" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      # Only the install fetches packages, so the npmrc is removed when it ends
      # and the steps after it, which run dependency code, do not find the token.
      - name: Install
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT; fi
          pnpm install --frozen-lockfile

      # Workers Logs must stay on (andrew-hesse/docs cloudflare/observability.md).
      # It runs after the install because it reads the config with the repo's own
      # Wrangler, and before lint so a missing block is the first failure shown.
      - name: Worker observability
        if: inputs.require-worker-observability
        run: |
          node --input-type=module <<'CHECK'
            // Fails unless every Wrangler config at the repo root keeps Workers Logs on, in
            // every environment (andrew-hesse/docs cloudflare/observability.md). It reads
            // the config with the repo's own Wrangler so JSONC, TOML and env inheritance
            // resolve exactly as at deploy time. Those readers are Wrangler's unstable and
            // experimental exports: when an upgrade renames one, this fails and names the
            // version instead of passing without checking anything.
            import { existsSync } from 'node:fs'
            import { createRequire } from 'node:module'
            import { resolve } from 'node:path'

            const fail = (message) => {
              console.error(`::error::${message}`)
              process.exit(1)
            }
            const configs = ['wrangler.json', 'wrangler.jsonc', 'wrangler.toml'].filter((f) => existsSync(f))
            if (configs.length === 0) {
              console.log('No Wrangler config at the repository root; nothing to check.')
              process.exit(0)
            }
            let wrangler
            let version
            try {
              wrangler = await import(createRequire(resolve('package.json')).resolve('wrangler'))
              version = createRequire(resolve('package.json'))('wrangler/package.json').version
            } catch {
              fail(`${configs.join(', ')} found but wrangler is not installed; add it to devDependencies.`)
            }
            for (const name of ['unstable_readConfig', 'experimental_readRawConfig']) {
              if (typeof wrangler[name] !== 'function')
                fail(`wrangler ${version} no longer exports ${name}; update the observability check in andrew-hesse/workflows.`)
            }
            const off = []
            let checked = 0
            for (const config of configs) {
              const envs = Object.keys(wrangler.experimental_readRawConfig({ config }).rawConfig?.env ?? {})
              for (const env of [undefined, ...envs]) {
                const { name, observability: o } = wrangler.unstable_readConfig({ config, env })
                // logs.enabled, when set, decides; otherwise the top-level switch does.
                const on = (o?.logs?.enabled ?? o?.enabled) === true
                checked++
                console.log(`${config} ${env ? `env.${env}` : '(top level)'} ${name}: Workers Logs ${on ? 'on' : 'OFF'}`)
                if (!on) off.push(`${config} ${env ? `env.${env}` : 'top level'}`)
              }
            }
            console.log(`Checked ${checked} environment(s) in ${configs.length} config(s) with wrangler ${version}.`)
            if (checked === 0) fail('Read no environment from the Wrangler config.')
            if (off.length)
              fail(`Workers Logs is off in ${off.join(', ')}. Add "observability": { "enabled": true } (andrew-hesse/docs cloudflare/observability.md).`)
          CHECK

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The input reaches the shell as an environment variable, never
      # interpolated into the script body: a ${{ }} expansion inside `run:` is
      # the template injection shape zizmor flags.
      - name: Test
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: pnpm run "$TEST_SCRIPT"

      - name: Build
        if: inputs.run-build
        run: pnpm build
