name: Node CI

# Reusable: the standard pnpm PR gate. Runs the same four scripts the pre-push
# hook runs, so a clean push means a green PR.
#
#   jobs:
#     ci:
#       uses: andrew-hesse/workflows/.github/workflows/node-ci.yml@f5f8d60f7bb85aa6486cdfacad9ef96c76751323 # v3.2
#
# This only works because the script vocabulary is standardised (see CI.md in
# ahesse/docs): every repo exposes lint, typecheck, test and build meaning the
# same thing. Without that this would need an input per script name, and the
# caller would be as long as the workflow it replaced.
#
# A repo needing extra setup (a system binary, a private registry credential)
# keeps its own ci.yml rather than passing a shell command in as an input:
# injecting `run:` content through an input is the template-injection shape the
# workflow linter flags.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major to test against. Match the repo's engines.node. Ignored if node-version-file is set."
        required: false
        type: string
        default: '24'
      node-version-file:
        description: >-
          Path to a file holding the Node version (.node-version, .nvmrc).
          Takes precedence over node-version, so a repo that pins the version in
          a file keeps one source of truth instead of restating it here.
        required: false
        type: string
        default: ''
      test-script:
        description: >-
          package.json script that runs the suite. Point it at a stricter script
          where the repo has one, typically a coverage run with enforced floors:
          a repo whose own gate was stricter than `pnpm test` would otherwise
          have to re-run the suite in a second job to keep that floor, and a
          gate may get stronger, never weaker.
        required: false
        type: string
        default: test
      run-build:
        description: "Run `pnpm build`. Off for repos with no build step."
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout. A hung job otherwise runs to GitHub's 6 hour default."
        required: false
        type: number
        default: 10
      npm-token-op-ref:
        description: >-
          op:// reference to a read:packages token, for repos installing private
          @andrew-hesse packages from npm.pkg.github.com, which serves no
          anonymous reads. Leave empty when every dependency is public.
          Requires the OP_SERVICE_ACCOUNT_TOKEN secret.
        required: false
        type: string
        default: ''
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "Only needed when npm-token-op-ref is set."
        required: false

permissions: {}

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so keep the job token out of .git/config where
          # any later step could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      # Two steps rather than one, because setup-node lets node-version win when
      # both are supplied: passing them together would silently ignore the file.
      - name: Setup Node.js
        if: inputs.node-version-file == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Setup Node.js (from file)
        if: inputs.node-version-file != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: 'pnpm'

      # op is not preinstalled on GitHub-hosted runners, and the install is per
      # job, so it has to happen here rather than in the caller.
      - name: Setup 1Password CLI
        if: inputs.npm-token-op-ref != ''
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      # The token goes in a user-level npmrc: pnpm refuses to expand credentials
      # read from a committed project .npmrc and fails later with a misleading
      # 401. The op:// ref travels via env, never interpolated into the shell.
      - name: Authenticate to GitHub Packages
        if: inputs.npm-token-op-ref != ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN_OP_REF: ${{ inputs.npm-token-op-ref }}
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' \
            "$(op read "$NPM_TOKEN_OP_REF")" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The input reaches the shell as an environment variable, never
      # interpolated into the script body: a ${{ }} expansion inside `run:` is
      # the template injection shape zizmor flags.
      - name: Test
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: pnpm run "$TEST_SCRIPT"

      - name: Build
        if: inputs.run-build
        run: pnpm build
