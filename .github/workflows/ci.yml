name: CI

# This repo ships the workflow linter, so it audits itself with it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    # A job calling a reusable workflow must grant its own permissions. A
    # reusable workflow can only narrow the caller's token, never widen it, so
    # with the workflow-level `permissions: {}` above and no grant here the run
    # ends in startup_failure before any step executes.
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml
